name: Dunolint Workflows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**" # This will match pull requests targeting any branch

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dunolint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The dunolint binary version used here must match the version of
      # [dunolint-lib] pinned in [test/dune-project]. The test config files are
      # generated using that library, and the binary must be able to parse them.
      # See [test/dune-project] for upgrade instructions.
      - name: Install dunolint
        uses: ./setup-dunolint
        with:
          dunolint-version: 0.0.20260306
          dunolint-digest: sha256:b83c07dd352cd4bec36b872ac593f299972710baff70a62e7a4650e80d2460d4

      - name: Check dunolint version
        run: dunolint --version

      - name: Lint Check
        uses: ./lint-check
        with:
          workspace-root: ./test
