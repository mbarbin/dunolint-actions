name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint action.yml files with actionlint
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

      - name: Lint shell scripts with shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find . -type f -name '*.sh' -exec shellcheck --shell=sh --format=tty {} +

      - name: Test local test script (archive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./setup-dunolint/test-install.sh \
            0.0.20260306 \
            sha256:b83c07dd352cd4bec36b872ac593f299972710baff70a62e7a4650e80d2460d4

      - name: Test local test script (raw binary fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./setup-dunolint/test-install.sh \
            0.0.20251006 \
            sha256:a9e6a634fae2d8b18d625e8a720c61d3c56247dd3b6e27f6464953a1b95e1c7e
